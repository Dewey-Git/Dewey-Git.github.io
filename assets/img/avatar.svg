<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="照片占位图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#131315"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.66">
      <stop offset="0" stop-color="#6b6b74" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6b6b74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#33333a"/>
    </linearGradient>
    <linearGradient id="head" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5b5b64"/>
      <stop offset="1" stop-color="#3d3d45"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- 肩部 / 上半身 -->
  <path d="M200 238c62 0 112 36 124 88l6 74H70l6-74c12-52 62-88 124-88z" fill="url(#body)"/>

  <!-- 头部 -->
  <circle cx="200" cy="166" r="60" fill="url(#head)"/>
  <path d="M158 128c8-26 26-40 42-40s34 14 42 40c-14-12-26-17-42-17s-28 5-42 17z" fill="#6b6b74" opacity="0.55"/>

  <!-- 内描边，避免与相框边框糊在一起 -->
  <rect x="0.5" y="0.5" width="399" height="399" fill="none" stroke="rgba(255,255,255,0.06)"/>
</svg>
